worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 5170;
    root /srv/portal;
    include /etc/nginx/spa.conf;
  }

  server {
    listen 5174;
    root /srv/proposta-1;
    include /etc/nginx/spa.conf;
  }

  server {
    listen 5175;
    root /srv/proposta-2;
    include /etc/nginx/spa.conf;
  }

  server {
    listen 5176;
    root /srv/proposta-3;
    include /etc/nginx/spa.conf;
  }

  server {
    listen 5177;
    root /srv/proposta-4;
    include /etc/nginx/spa.conf;
  }

  server {
    listen 5178;
    root /srv/proposta-5;
    include /etc/nginx/spa.conf;
  }
}
