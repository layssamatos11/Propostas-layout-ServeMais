services:
  servemais:
    build: .
    image: servemais
    ports:
      - "5170:5170"
      - "5174:5174"
      - "5175:5175"
      - "5176:5176"
      - "5177:5177"
      - "5178:5178"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5170/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
